name: T034 one-time private test image publication

on:
  push:
    branches: [feature/f0-04-code-quality-ci]
    paths:
      - '.github/workflows/f04-t034-candidates.yml'

permissions:
  contents: read

jobs:
  candidate-build:
    if: ${{ github.repository == 'Elmo-Tech/ecommerce_v2_api' && github.ref == 'refs/heads/feature/f0-04-code-quality-ci' && github.event.before == '4d362a3d32b6e05168597f838664bb9579ca5a30' && github.run_attempt == 1 }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact authorized feature push
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create owned candidate report directory
        id: report
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          dir="$(mktemp -d "$RUNNER_TEMP/f04-t034-report-XXXXXXXXXXXX")"
          printf 'F04_CANDIDATE_REPORT=%s\n' "$dir" >> "$GITHUB_ENV"

      - name: Install approved PHP 8.4 native extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_sqlite, pdo_pgsql, redis-6.3.0
          tools: composer:2.11.3

      - name: Build, scan, test and publish only verified private candidates
        shell: bash
        env:
          F04_GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          set -o noclobber
          python3 -B tools/quality/security/t034-candidate-build.py > "$F04_CANDIDATE_REPORT/candidates.summary.json"

      - name: Upload bounded publication and test evidence
        if: ${{ always() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: f04-t034-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.F04_CANDIDATE_REPORT }}/candidates.summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify exact owned report cleanup
        if: ${{ always() && steps.report.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, stat
          from pathlib import Path
          p=Path(os.environ["F04_CANDIDATE_REPORT"])
          assert p.parent==Path(os.environ["RUNNER_TEMP"]).resolve() and re.fullmatch(r"f04-t034-report-[A-Za-z0-9]{12}",p.name)
          assert not p.is_symlink() and p.resolve()==p and p.stat().st_uid==os.geteuid() and stat.S_IMODE(p.stat().st_mode)==0o700
          f=p/"candidates.summary.json"
          assert set(x.name for x in p.iterdir())=={f.name}
          s=f.lstat()
          assert stat.S_ISREG(s.st_mode) and s.st_nlink==1 and s.st_uid==os.geteuid()
          f.unlink()
          p.rmdir()
          assert not p.exists()
          PY
