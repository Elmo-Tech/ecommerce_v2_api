name: FND-01 Spec Kit script regressions

on:
  push:
    branches:
      - feature/f0-spec-kit-setup
    paths:
      - '.specify/scripts/**'
      - '.specify/templates/**'
      - 'tests/spec_kit/**'
      - '.github/workflows/fnd-01-spec-kit-review.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fnd-01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-kit-regressions:
    name: Shell and Markdown regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up isolated Python for real YAML manifest fixtures
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install test-only preset manifest parser
        run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Verify expected host tools
        run: |
          python3 --version
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
          jq --version
          bash --version | head -n 1

      - name: Parse all Spec Kit shell scripts
        run: find .specify/scripts/bash -type f -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n

      - name: Run isolated legacy regression tests
        if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'development') }}
        run: python3 -m unittest discover -s tests/spec_kit -p 'test_*.py' -v

      - name: Create exact private report directory
        id: scratch
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          dir="$(mktemp -d "$RUNNER_TEMP/f04-spec-kit-XXXXXXXXXXXX")"
          printf 'F04_SPEC_DIR=%s\n' "$dir" >> "$GITHUB_ENV"
          printf 'F04_LANE_STARTED=%s\n' "$(python3 -c 'import time; print(time.monotonic())')" >> "$GITHUB_ENV"

      - name: Run isolated regression suite and record exact case identities
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          set -o noclobber
          python3 -B tools/quality/spec-kit-report.py > "$F04_SPEC_DIR/spec-kit.summary.json"

      - name: Ensure tests did not mutate tracked project files
        run: git diff --exit-code -- .

      - name: Seal validated spec-kit evidence
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' }}
        run: python3 -B tools/quality/artifact-io.py seal spec-kit "$F04_SPEC_DIR"

      - name: Upload fixed safe spec-kit reports
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: f04-spec-kit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.F04_SPEC_DIR }}/spec-kit.summary.json
            ${{ env.F04_SPEC_DIR }}/lane.summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify exact owned report cleanup
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        run: python3 -B tools/quality/artifact-io.py cleanup-lane spec-kit "$F04_SPEC_DIR"
