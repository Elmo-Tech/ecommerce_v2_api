name: FND-01 Spec Kit script regressions

on:
  push:
    branches:
      - feature/f0-spec-kit-setup
    paths:
      - '.specify/scripts/**'
      - '.specify/templates/**'
      - 'tests/spec_kit/**'
      - '.github/workflows/fnd-01-spec-kit-review.yml'
  pull_request:
    branches:
      - development
    paths:
      - '.specify/scripts/**'
      - '.specify/templates/**'
      - 'tests/spec_kit/**'
      - '.github/workflows/fnd-01-spec-kit-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fnd-01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-kit-regressions:
    name: Shell and Markdown regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4

      - name: Set up isolated Python for real YAML manifest fixtures
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test-only preset manifest parser
        run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Verify expected host tools
        run: |
          python3 --version
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
          jq --version
          bash --version | head -n 1

      - name: Parse all Spec Kit shell scripts
        run: find .specify/scripts/bash -type f -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n

      - name: Run isolated regression tests
        run: python3 -m unittest discover -s tests/spec_kit -p 'test_*.py' -v

      - name: Ensure tests did not mutate tracked project files
        run: git diff --exit-code -- .
