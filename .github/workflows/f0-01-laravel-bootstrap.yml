name: F0-01 Laravel bootstrap validation

on:
  push:
    branches:
      - feature/f0-01-laravel-bootstrap
    paths:
      - composer.json
      - composer.lock
      - app/**
      - bootstrap/**
      - config/**
      - public/**
      - routes/**
      - tests/**
      - phpunit.xml
      - .github/workflows/f0-01-laravel-bootstrap.yml
  pull_request:
    branches:
      - feature/f0-spec-kit-setup
    paths:
      - composer.json
      - composer.lock
      - app/**
      - bootstrap/**
      - config/**
      - public/**
      - routes/**
      - tests/**
      - phpunit.xml
      - .github/workflows/f0-01-laravel-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f0-01-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Isolated PHP 8.4 Composer and Laravel smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_NAME: EcommerceSaaSAPI
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost
      APP_KEY: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      MAIL_MAILER: log
      XDEBUG_MODE: off
    steps:
      - name: Checkout the reviewed feature branch
        uses: actions/checkout@v4

      - name: Install PHP 8.4 and required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_sqlite
          tools: composer:v2

      - name: Verify PHP and validate minimal Composer manifest
        run: |
          php -v
          composer --version
          composer validate --strict --no-check-publish

      - name: Resolve and generate candidate composer.lock without install or scripts
        run: composer update --no-install --no-scripts --no-plugins --no-interaction --no-progress --prefer-dist

      - name: Validate resolved dependency graph and platform
        run: |
          composer validate --strict --no-check-publish
          composer check-platform-reqs --lock

      - name: Publish candidate lockfile for reviewed integration (never auto-commit)
        uses: actions/upload-artifact@v4
        with:
          name: f0-01-reviewed-candidate-composer-lock
          path: composer.lock
          retention-days: 7
          if-no-files-found: error

      - name: Install dependencies without Composer scripts or plugins
        run: composer install --no-scripts --no-plugins --no-interaction --prefer-dist --no-progress

      - name: Verify actual installed packages and framework bootstrap
        run: |
          composer check-platform-reqs
          php -l bootstrap/app.php
          php -l routes/console.php
          php artisan about --no-ansi
          php artisan route:list --json

      - name: Execute foundation smoke test without migrations or real database
        run: |
          php artisan test --group=foundation --fail-on-empty-test-suite --no-ansi

      - name: Check runtime source tree did not change tracked files
        run: |
          git diff --exit-code -- composer.json bootstrap/app.php docs/ specs/ .specify/ README.md

