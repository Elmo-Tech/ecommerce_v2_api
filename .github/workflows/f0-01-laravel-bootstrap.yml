name: Laravel foundation validation

# F0-04 T004: run the unchanged F0-03 baseline before adding quality tooling.

# F0-03 T004: trigger the unchanged foundation baseline on the reviewed PR candidate.

on:
  push:
    branches:
      - feature/f0-01-laravel-bootstrap
    paths:
      - composer.json
      - composer.lock
      - artisan
      - app/**
      - bootstrap/**
      - config/**
      - public/**
      - routes/**
      - lang/**
      - specs/002-api-foundation/contracts/**
      - tests/**
      - phpunit.xml
      - phpunit.integration.xml
      - .github/workflows/f0-01-laravel-bootstrap.yml
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches:
      - feature/f0-spec-kit-setup
      - development
    paths:
      - composer.json
      - composer.lock
      - artisan
      - app/**
      - bootstrap/**
      - config/**
      - public/**
      - routes/**
      - lang/**
      - specs/002-api-foundation/contracts/**
      - tests/**
      - phpunit.xml
      - phpunit.integration.xml
      - .github/workflows/f0-01-laravel-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f0-01-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Isolated PHP 8.4 Composer and Laravel smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_NAME: EcommerceSaaSAPI
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost
      APP_KEY: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      MAIL_MAILER: array
      XDEBUG_MODE: off
    steps:
      - name: Checkout the reviewed feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create private per-job report directory
        id: report_dir
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          report_dir="$(mktemp -d "$RUNNER_TEMP/f03-reports-XXXXXXXXXXXX")"
          printf 'F03_REPORT_DIR=%s\n' "$report_dir" >> "$GITHUB_ENV"

      - name: Install PHP 8.4 and required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_sqlite
          tools: composer:v2

      - name: Verify PHP and validate minimal Composer manifest
        run: |
          php -v
          composer --version
          composer validate --strict --no-check-publish

      - name: Validate committed dependency lock and platform
        run: |
          test -s composer.lock
          composer validate --strict --no-check-publish
          composer check-platform-reqs --lock

      - name: Publish committed lockfile for reproducibility review
        uses: actions/upload-artifact@v4
        with:
          name: f0-01-committed-composer-lock
          path: composer.lock
          retention-days: 7
          if-no-files-found: error

      - name: Install pinned dependencies without Composer scripts or plugins
        run: composer install --no-scripts --no-plugins --no-interaction --prefer-dist --no-progress

      - name: Audit pinned dependency versions
        run: composer audit --locked --no-interaction

      - name: Establish safe fast environment before framework bootstrap
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ ! -e .env ] && [ ! -L .env ]; then
            (set -o noclobber; : > .env)
          fi
          test -f .env && test ! -L .env && test ! -s .env
          git check-ignore -q .env
          php tests/Support/bootstrap.php

      - name: Verify actual installed packages and framework bootstrap
        run: |
          composer check-platform-reqs
          php -l bootstrap/app.php
          php -l routes/console.php
          php artisan about --no-ansi
          php artisan route:list --json

      - name: Verify all tracked PHP syntax before tests
        id: fast_ready
        run: git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l

      - name: Execute original foundation group with native JUnit
        id: foundation
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php foundation

      - name: Execute complete fast suite with native JUnit
        id: fast_all
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php fast-all

      - name: Execute independent Architecture with native JUnit
        id: architecture
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php architecture

      - name: Record blocked fast selections when preflight failed
        if: ${{ !cancelled() && steps.report_dir.outcome == 'success' && steps.fast_ready.outcome != 'success' }}
        shell: bash
        run: |
          set +e
          status=0
          for selection in foundation fast-all architecture; do
            php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php "$selection" --blocked
            code=$?
            if [ "$status" -eq 0 ] && [ "$code" -ne 0 ]; then status="$code"; fi
          done
          exit "$status"

      # Transitional acquisition check only (T008). No unguarded quality tool execution.
      # The actual read-only format and guarded level-6 analysis gates arrive in T012-T019/T042.
      - name: Verify installed approved quality packages without running analyzers
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: |
          set -euo pipefail
          git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l
          python3 - <<'PY'
          import json, pathlib, hashlib
          lock_path = pathlib.Path('composer.lock')
          assert hashlib.sha256(lock_path.read_bytes()).hexdigest() == '4f86a8d3e61aeddae531a177d901a0aa6632713116d9f959537102282079473e'
          lock = json.loads(lock_path.read_text())
          installed = json.loads(pathlib.Path('vendor/composer/installed.json').read_text())
          expected = {p['name']: p for p in lock['packages'] + lock['packages-dev']}
          actual = {p['name']: p for p in installed['packages']}
          assert len(expected) == 122 and len(actual) == 122 and set(expected) == set(actual), 'Installed package inventory mismatch'
          assert installed['dev'] is True
          for name, record in expected.items():
              observed = actual[name]
              assert observed['version'] == record['version'], 'Installed version mismatch: ' + name
              for kind in ('source', 'dist'):
                  if record.get(kind, {}).get('reference'):
                      assert observed.get(kind, {}).get('reference') == record[kind]['reference'], 'Installed reference mismatch: ' + name
          approved = {'laravel/pint': 'v1.32.3', 'phpstan/phpstan': '2.3.7', 'larastan/larastan': 'v3.15.0', 'iamcal/sql-parser': 'v0.7'}
          assert all(actual[n]['version'] == v for n, v in approved.items())
          assert pathlib.Path('vendor/larastan/larastan/extension.neon').is_file()
          print(json.dumps({'task': 'T008', 'installed_count': len(actual), 'approved_dev_packages': approved, 'installed_metadata': 'PASSED', 'format': 'NOT_RUN', 'analysis': 'NOT_RUN'}, sort_keys=True))
          PY
          test -x vendor/bin/pint
          test -x vendor/bin/phpstan
          echo "::notice title=Quality gates pending::Acquisition verified; Pint and guarded level-6 analysis are not run by this transitional check."

      - name: Verify runtime did not change any tracked repository file
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: git diff --exit-code -- .

      - name: Publish only validated fast JUnit and safe summaries
        id: fast_upload
        if: ${{ always() && steps.report_dir.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: f03-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.F03_REPORT_DIR }}/foundation-safe.xml
            ${{ env.F03_REPORT_DIR }}/foundation.summary.json
            ${{ env.F03_REPORT_DIR }}/fast-all-safe.xml
            ${{ env.F03_REPORT_DIR }}/fast-all.summary.json
            ${{ env.F03_REPORT_DIR }}/architecture-safe.xml
            ${{ env.F03_REPORT_DIR }}/architecture.summary.json
          retention-days: 7
          if-no-files-found: error

      - name: Clean only owned report files after publication
        id: fast_report_cleanup
        if: ${{ always() && steps.report_dir.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-reports.php

  f0-03-integration:
    name: F0-03 isolated native PostgreSQL and Redis integration
    needs: bootstrap
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      F03_MODE: integration
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      DB_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      XDEBUG_MODE: off
    steps:
      - name: Checkout exact integrated candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create private report directory
        id: report_dir
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          report_dir="$(mktemp -d "$RUNNER_TEMP/f03-reports-XXXXXXXXXXXX")"
          printf 'F03_REPORT_DIR=%s\n' "$report_dir" >> "$GITHUB_ENV"

      - name: Install approved PHP 8.4 native extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_sqlite, pdo_pgsql, redis-6.3.0
          tools: composer:v2

      - name: Validate actual hosted local Docker and immutable approved images
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          test "$APP_ENV" = testing
          test -z "${DOCKER_HOST:-}"
          test -z "${DOCKER_CONTEXT:-}"
          test -z "${DOCKER_TLS_VERIFY:-}"
          test -z "${DOCKER_CERT_PATH:-}"
          test -z "${DOCKER_CONFIG:-}"
          test -z "${DOCKER_API_VERSION:-}"
          test "$(docker context show)" = default
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock
          test -S /var/run/docker.sock
          test "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" = linux/amd64
          echo "Source checkout: $(git rev-parse HEAD)"
          for image in \
            docker.io/library/postgres:17.12-bookworm@sha256:c7a16500f728a9c09731e772f228ee7a29615585e8019772f05b620522f62d03 \
            docker.io/library/redis:8.2.11-bookworm@sha256:0e125214188816ac08e22435c7a5f58c61b8cbd3251d62e380d14fdf7659cd87; do
            docker --host unix:///var/run/docker.sock pull --platform linux/amd64 "$image"
            test "$(docker --host unix:///var/run/docker.sock image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
            digest="${image##*@}"
            docker --host unix:///var/run/docker.sock image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "@$digest" >/dev/null
            docker --host unix:///var/run/docker.sock image inspect "$image" --format 'Image ID={{.Id}} platform={{.Os}}/{{.Architecture}} RepoDigests={{json .RepoDigests}}'
          done

      - name: Verify locked packages and approved native drivers before setup
        shell: bash
        run: |
          set -euo pipefail
          php -v
          composer --version
          php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 4 || !in_array("pgsql", PDO::getAvailableDrivers(), true) || phpversion("redis") !== "6.3.0") { fwrite(STDERR, "Approved native driver/version unavailable.\n"); exit(1); } printf("pdo_pgsql=%s; phpredis=%s\n", phpversion("pdo_pgsql"), phpversion("redis"));'
          test -s composer.lock
          composer validate --strict --no-check-publish
          composer check-platform-reqs --lock
          composer install --no-scripts --no-plugins --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs
          composer audit --locked --no-interaction
          vendor/bin/pest --version
          vendor/bin/phpunit --version
          git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l

      - name: Bind a fresh run identity to this hosted job
        id: run_identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ ! -e .env ] && [ ! -L .env ]; then
            (set -o noclobber; : > .env)
          fi
          test -f .env && test ! -L .env && test ! -s .env
          git check-ignore -q .env
          token="$(php -r 'echo bin2hex(random_bytes(8));')"
          [[ "$token" =~ ^[0-9a-f]{16}$ ]]
          test ! -e "$RUNNER_TEMP/f03-$token"
          test ! -L "$RUNNER_TEMP/f03-$token"
          printf 'F03_RUN_TOKEN=%s\nF03_RUN_DESCRIPTOR=%s/f03-%s/runtime.json\n' "$token" "$RUNNER_TEMP" "$token" >> "$GITHUB_ENV"

      - name: Create and capture only owned isolated containers
        id: owned_start
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/start-owned.php

      - name: Configure owned PostgreSQL grants and Redis ACL
        id: owned_setup
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/setup-owned.php

      - name: Execute complete explicit native Integration suite
        id: integration_tests
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php integration

      - name: Record integration blocked before test execution
        if: ${{ !cancelled() && steps.report_dir.outcome == 'success' && steps.integration_tests.outcome == 'skipped' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php integration --blocked

      - name: Verify actual owned cleanup and repeat absence
        id: owned_cleanup
        if: ${{ always() && steps.run_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-owned.php
          php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-owned.php

      - name: Verify integration did not modify tracked repository files
        if: ${{ !cancelled() && steps.run_identity.outcome == 'success' }}
        run: git diff --exit-code -- .

      - name: Publish only validated integration JUnit and safe summary
        id: integration_upload
        if: ${{ always() && steps.report_dir.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: f03-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.F03_REPORT_DIR }}/integration-safe.xml
            ${{ env.F03_REPORT_DIR }}/integration.summary.json
          retention-days: 7
          if-no-files-found: error

      - name: Clean only owned report files after publication
        id: integration_report_cleanup
        if: ${{ always() && steps.report_dir.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-reports.php

  # Temporary T009 acquisition-only diagnostic. No validation or audit pass claimed.
  f0-04-t009-acquisition:
    name: F0-04 T009 isolated Redocly locked acquisition
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact integrated candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Exact approved Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - name: Create owned private acquisition directory
        id: scratch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          dir="$(mktemp -d "$RUNNER_TEMP/f04-t009-XXXXXXXXXXXX")"
          printf 'F04_T009_DIR=%s\n' "$dir" >> "$GITHUB_ENV"
          printf '%s:%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$dir/owner"
      - name: Acquire exact Redocly without scripts or application access
        shell: bash
        env:
          F04_SOURCE: ${{ github.event.pull_request.head.sha }}
          F04_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess, time
          root = pathlib.Path.cwd().resolve()
          scratch = pathlib.Path(os.environ['F04_T009_DIR'])
          out = scratch / 'safe'
          out.mkdir(mode=0o700)
          start = time.monotonic()
          result = {'schema': 1, 'task': 'T009', 'source': os.environ['F04_SOURCE'], 'base': os.environ['F04_BASE'], 'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'status': 'BLOCKED', 'stage': 'identity'}
          def require(condition, reason):
              if not condition:
                  result['reason'] = reason
                  raise RuntimeError(reason)
          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          def command(args, cwd, stage, env=None):
              result['stage'] = stage
              child = subprocess.run(args, cwd=cwd, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=300, check=False)
              (scratch/(stage+'.private.log')).write_bytes(child.stdout)
              if child.returncode:
                  result['exit_code'] = child.returncode
                  raise RuntimeError('Acquisition command failed')
              return child.stdout.decode('utf-8','replace').strip()
          try:
              result['checkout'] = command(['git','rev-parse','HEAD'],root,'checkout')
              commit = command(['git','cat-file','-p','HEAD'],root,'parents')
              parents = re.findall(r'^parent ([0-9a-f]{40})$',commit.split('\n\n',1)[0],re.M)
              require(result['base']=='24ce00231dec35a089bb70c081b257f9b5d234e7' and parents==[result['base'],result['source']], 'Unexpected integrated checkout')
              project = root/'tools/quality/openapi'
              work = scratch/'work'
              home = scratch/'home'
              tmp = scratch/'tmp'
              for path in (work,home,tmp): path.mkdir(mode=0o700)
              for name in ('package.json','package-lock.json'):
                  shutil.copyfile(project/name,work/name)
              lock = work/'package-lock.json'
              expected = 'a987d3b6bef34c77a4d1acc7bdbdeb163e82f3a87aef0dfa15abd004765466a0'
              require(sha(lock)==expected,'Unapproved npm lock bytes')
              manifest = json.loads((work/'package.json').read_text())
              require(manifest=={'name':'f04-quality-openapi','version':'0.0.0','private':True,'devDependencies':{'@redocly/cli':'2.83.0'}},'Unexpected npm manifest')
              packages=json.loads(lock.read_text())['packages']
              require(set(packages)=={'','node_modules/@redocly/cli'},'Unexpected npm lock package inventory')
              record=packages['node_modules/@redocly/cli']
              require(record['version']=='2.83.0' and record['resolved']=='https://registry.npmjs.org/@redocly/cli/-/cli-2.83.0.tgz' and record['integrity'].startswith('sha512-') and not record.get('hasInstallScript'),'Unapproved npm package metadata')
              (scratch/'user.npmrc').touch(mode=0o600)
              (scratch/'global.npmrc').touch(mode=0o600)
              env={'PATH':os.environ['PATH'],'HOME':str(home),'TMPDIR':str(tmp),'CI':'true','NPM_CONFIG_USERCONFIG':str(scratch/'user.npmrc'),'NPM_CONFIG_GLOBALCONFIG':str(scratch/'global.npmrc'),'NPM_CONFIG_CACHE':str(scratch/'npm-cache'),'NPM_CONFIG_REGISTRY':'https://registry.npmjs.org/','REDOCLY_TELEMETRY':'off','REDOCLY_SUPPRESS_NOTIFICATIONS':'true','NO_COLOR':'1'}
              node=command(['node','--version'],work,'node-version',env)
              npm=command(['npm','--version'],work,'npm-version',env)
              require(node=='v24.22.3' and tuple(map(int,npm.split('.')[:3])) >= (10,9,2),'Unexpected Node/npm versions')
              result['versions']={'node':node,'npm':npm}
              command(['npm','ci','--ignore-scripts','--no-audit','--no-fund','--registry=https://registry.npmjs.org/'],work,'locked-install',env)
              require(sha(lock)==expected and (work/'package.json').read_bytes()==(project/'package.json').read_bytes(),'Manifest or lock mutated')
              actual = json.loads((work/'node_modules/.package-lock.json').read_text())['packages']
              require(set(actual)=={'node_modules/@redocly/cli'},'Installed npm package inventory mismatch')
              installed=actual['node_modules/@redocly/cli']
              require(all(installed.get(k)==record[k] for k in ('version','resolved','integrity')),'Installed npm identity mismatch')
              package=work/'node_modules/@redocly/cli'
              meta=json.loads((package/'package.json').read_text())
              require(meta['name']=='@redocly/cli' and meta['version']=='2.83.0' and meta['bin']['redocly']=='bin/cli.js','Installed Redocly metadata mismatch')
              entry=package/'bin/cli.js'
              require(entry.is_file() and not entry.is_symlink() and entry.resolve().is_relative_to(package.resolve()),'Unexpected Redocly entrypoint')
              version=command(['node',str(entry),'--version'],work,'redocly-version',env)
              require(version=='2.83.0','Redocly version command mismatch')
              command(['git','diff','--exit-code','--','.'],root,'tracked-source')
              result.update(status='PASSED',stage='complete',exit_code=0,lock_sha256=expected,installed_packages=1,redocly=version,lifecycle_scripts='disabled',contract_validation='NOT_RUN',npm_audit='NOT_RUN')
          except (RuntimeError, OSError, ValueError, KeyError, subprocess.TimeoutExpired):
              result.setdefault('reason','Acquisition failed or incomplete')
              result.setdefault('exit_code',2)
          finally:
              result['duration_seconds']=round(time.monotonic()-start,3)
              (out/'acquisition.summary.json').write_text(json.dumps(result,indent=2)+'\n')
              print(json.dumps(result,indent=2))
          raise SystemExit(0 if result['status']=='PASSED' else 2)
          PY
      - name: Publish bounded acquisition evidence
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: f04-t009-acquisition-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.F04_T009_DIR }}/safe/acquisition.summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove only owned acquisition directory
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, shutil
          path = pathlib.Path(os.environ['F04_T009_DIR'])
          parent = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          expected = os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_RUN_ATTEMPT']+'\n'
          if path.is_symlink() or path.resolve()!=path or path.parent!=parent or not re.fullmatch(r'f04-t009-[A-Za-z0-9]{12}',path.name) or (path/'owner').read_text()!=expected:
              raise SystemExit('Refused unowned acquisition cleanup')
          shutil.rmtree(path)
          print('Owned T009 acquisition cleanup verified.')
          PY
