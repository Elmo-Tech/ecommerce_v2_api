name: Laravel foundation validation

# F0-04 T004: run the unchanged F0-03 baseline before adding quality tooling.

# F0-03 T004: trigger the unchanged foundation baseline on the reviewed PR candidate.

on:
  push:
    branches:
      - feature/f0-01-laravel-bootstrap
    paths:
      - composer.json
      - composer.lock
      - artisan
      - app/**
      - bootstrap/**
      - config/**
      - public/**
      - routes/**
      - lang/**
      - specs/002-api-foundation/contracts/**
      - tests/**
      - phpunit.xml
      - phpunit.integration.xml
      - .github/workflows/f0-01-laravel-bootstrap.yml
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches:
      - feature/f0-spec-kit-setup
      - development
    paths:
      - composer.json
      - composer.lock
      - artisan
      - app/**
      - bootstrap/**
      - config/**
      - public/**
      - routes/**
      - lang/**
      - specs/002-api-foundation/contracts/**
      - tests/**
      - phpunit.xml
      - phpunit.integration.xml
      - .github/workflows/f0-01-laravel-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f0-01-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Isolated PHP 8.4 Composer and Laravel smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_NAME: EcommerceSaaSAPI
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost
      APP_KEY: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      MAIL_MAILER: array
      XDEBUG_MODE: off
    steps:
      - name: Checkout the reviewed feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create private per-job report directory
        id: report_dir
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          report_dir="$(mktemp -d "$RUNNER_TEMP/f03-reports-XXXXXXXXXXXX")"
          printf 'F03_REPORT_DIR=%s\n' "$report_dir" >> "$GITHUB_ENV"

      - name: Install PHP 8.4 and required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_sqlite
          tools: composer:v2

      - name: Verify PHP and validate minimal Composer manifest
        run: |
          php -v
          composer --version
          composer validate --strict --no-check-publish

      - name: Validate committed dependency lock and platform
        run: |
          test -s composer.lock
          composer validate --strict --no-check-publish
          composer check-platform-reqs --lock

      - name: Publish committed lockfile for reproducibility review
        uses: actions/upload-artifact@v4
        with:
          name: f0-01-committed-composer-lock
          path: composer.lock
          retention-days: 7
          if-no-files-found: error

      - name: Install pinned dependencies without Composer scripts or plugins
        run: composer install --no-scripts --no-plugins --no-interaction --prefer-dist --no-progress

      - name: Audit pinned dependency versions
        run: composer audit --locked --no-interaction

      - name: Establish safe fast environment before framework bootstrap
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ ! -e .env ] && [ ! -L .env ]; then
            (set -o noclobber; : > .env)
          fi
          test -f .env && test ! -L .env && test ! -s .env
          git check-ignore -q .env
          php tests/Support/bootstrap.php

      - name: Verify actual installed packages and framework bootstrap
        run: |
          composer check-platform-reqs
          php -l bootstrap/app.php
          php -l routes/console.php
          php artisan about --no-ansi
          php artisan route:list --json

      - name: Verify all tracked PHP syntax before tests
        id: fast_ready
        run: git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l

      - name: Execute original foundation group with native JUnit
        id: foundation
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php foundation

      - name: Execute complete fast suite with native JUnit
        id: fast_all
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php fast-all

      - name: Execute independent Architecture with native JUnit
        id: architecture
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php architecture

      - name: Record blocked fast selections when preflight failed
        if: ${{ !cancelled() && steps.report_dir.outcome == 'success' && steps.fast_ready.outcome != 'success' }}
        shell: bash
        run: |
          set +e
          status=0
          for selection in foundation fast-all architecture; do
            php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php "$selection" --blocked
            code=$?
            if [ "$status" -eq 0 ] && [ "$code" -ne 0 ]; then status="$code"; fi
          done
          exit "$status"

      - name: PHP syntax lint and optional quality-tool availability
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: |
          git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l
          if [ -x vendor/bin/pint ]; then
            vendor/bin/pint --test
          else
            echo "::notice title=Pint unavailable::Laravel Pint is not in the approved composer.lock; no Pint pass is claimed."
          fi
          if [ -x vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse --no-progress
          else
            echo "::notice title=PHPStan unavailable::PHPStan/Larastan is not in the approved composer.lock; no static-analyzer pass is claimed."
          fi

      - name: Verify runtime did not change any tracked repository file
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: git diff --exit-code -- .

      - name: Publish only validated fast JUnit and safe summaries
        id: fast_upload
        if: ${{ always() && steps.report_dir.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: f03-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.F03_REPORT_DIR }}/foundation-safe.xml
            ${{ env.F03_REPORT_DIR }}/foundation.summary.json
            ${{ env.F03_REPORT_DIR }}/fast-all-safe.xml
            ${{ env.F03_REPORT_DIR }}/fast-all.summary.json
            ${{ env.F03_REPORT_DIR }}/architecture-safe.xml
            ${{ env.F03_REPORT_DIR }}/architecture.summary.json
          retention-days: 7
          if-no-files-found: error

      - name: Clean only owned report files after publication
        id: fast_report_cleanup
        if: ${{ always() && steps.report_dir.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-reports.php

  f0-03-integration:
    name: F0-03 isolated native PostgreSQL and Redis integration
    needs: bootstrap
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      F03_MODE: integration
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      DB_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      XDEBUG_MODE: off
    steps:
      - name: Checkout exact integrated candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create private report directory
        id: report_dir
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          report_dir="$(mktemp -d "$RUNNER_TEMP/f03-reports-XXXXXXXXXXXX")"
          printf 'F03_REPORT_DIR=%s\n' "$report_dir" >> "$GITHUB_ENV"

      - name: Install approved PHP 8.4 native extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_sqlite, pdo_pgsql, redis-6.3.0
          tools: composer:v2

      - name: Validate actual hosted local Docker and immutable approved images
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          test "$APP_ENV" = testing
          test -z "${DOCKER_HOST:-}"
          test -z "${DOCKER_CONTEXT:-}"
          test -z "${DOCKER_TLS_VERIFY:-}"
          test -z "${DOCKER_CERT_PATH:-}"
          test -z "${DOCKER_CONFIG:-}"
          test -z "${DOCKER_API_VERSION:-}"
          test "$(docker context show)" = default
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock
          test -S /var/run/docker.sock
          test "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" = linux/amd64
          echo "Source checkout: $(git rev-parse HEAD)"
          for image in \
            docker.io/library/postgres:17.12-bookworm@sha256:c7a16500f728a9c09731e772f228ee7a29615585e8019772f05b620522f62d03 \
            docker.io/library/redis:8.2.11-bookworm@sha256:0e125214188816ac08e22435c7a5f58c61b8cbd3251d62e380d14fdf7659cd87; do
            docker --host unix:///var/run/docker.sock pull --platform linux/amd64 "$image"
            test "$(docker --host unix:///var/run/docker.sock image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
            digest="${image##*@}"
            docker --host unix:///var/run/docker.sock image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "@$digest" >/dev/null
            docker --host unix:///var/run/docker.sock image inspect "$image" --format 'Image ID={{.Id}} platform={{.Os}}/{{.Architecture}} RepoDigests={{json .RepoDigests}}'
          done

      - name: Verify locked packages and approved native drivers before setup
        shell: bash
        run: |
          set -euo pipefail
          php -v
          composer --version
          php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 4 || !in_array("pgsql", PDO::getAvailableDrivers(), true) || phpversion("redis") !== "6.3.0") { fwrite(STDERR, "Approved native driver/version unavailable.\n"); exit(1); } printf("pdo_pgsql=%s; phpredis=%s\n", phpversion("pdo_pgsql"), phpversion("redis"));'
          test -s composer.lock
          composer validate --strict --no-check-publish
          composer check-platform-reqs --lock
          composer install --no-scripts --no-plugins --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs
          composer audit --locked --no-interaction
          vendor/bin/pest --version
          vendor/bin/phpunit --version
          git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l

      - name: Bind a fresh run identity to this hosted job
        id: run_identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ ! -e .env ] && [ ! -L .env ]; then
            (set -o noclobber; : > .env)
          fi
          test -f .env && test ! -L .env && test ! -s .env
          git check-ignore -q .env
          token="$(php -r 'echo bin2hex(random_bytes(8));')"
          [[ "$token" =~ ^[0-9a-f]{16}$ ]]
          test ! -e "$RUNNER_TEMP/f03-$token"
          test ! -L "$RUNNER_TEMP/f03-$token"
          printf 'F03_RUN_TOKEN=%s\nF03_RUN_DESCRIPTOR=%s/f03-%s/runtime.json\n' "$token" "$RUNNER_TEMP" "$token" >> "$GITHUB_ENV"

      - name: Create and capture only owned isolated containers
        id: owned_start
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/start-owned.php

      - name: Configure owned PostgreSQL grants and Redis ACL
        id: owned_setup
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/setup-owned.php

      - name: Execute complete explicit native Integration suite
        id: integration_tests
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php integration

      - name: Record integration blocked before test execution
        if: ${{ !cancelled() && steps.report_dir.outcome == 'success' && steps.integration_tests.outcome == 'skipped' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php integration --blocked

      - name: Verify actual owned cleanup and repeat absence
        id: owned_cleanup
        if: ${{ always() && steps.run_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-owned.php
          php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-owned.php

      - name: Verify integration did not modify tracked repository files
        if: ${{ !cancelled() && steps.run_identity.outcome == 'success' }}
        run: git diff --exit-code -- .

      - name: Publish only validated integration JUnit and safe summary
        id: integration_upload
        if: ${{ always() && steps.report_dir.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: f03-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.F03_REPORT_DIR }}/integration-safe.xml
            ${{ env.F03_REPORT_DIR }}/integration.summary.json
          retention-days: 7
          if-no-files-found: error

      - name: Clean only owned report files after publication
        id: integration_report_cleanup
        if: ${{ always() && steps.report_dir.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-reports.php

  # Temporary T006 solver-only preflight; remove after actual evidence review.
  # No project dependency install or application bootstrap. Existing jobs unchanged.
  f0-04-t006-compatibility-preflight:
    name: F0-04 T006 isolated dependency resolution
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      COMPOSER_NO_INTERACTION: "1"
      COMPOSER_DISABLE_XDEBUG_WARN: "1"
      REDOCLY_TELEMETRY: "off"
      REDOCLY_SUPPRESS_NOTIFICATIONS: "true"
    steps:
      - name: Checkout exact preflight candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: PHP and Composer for scratch solver
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_sqlite, tokenizer
          tools: composer:2.11.3
      - name: Exact Node for scratch lock resolution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - name: Create private owned preflight directory
        id: scratch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          dir="$(mktemp -d "$RUNNER_TEMP/f04-t006-XXXXXXXXXXXX")"
          printf 'F04_PREFLIGHT_DIR=%s\n' "$dir" >> "$GITHUB_ENV"
          printf '%s:%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$dir/owner"
      - name: Resolve exact proposed locks without installing packages
        shell: bash
        env:
          APPROVED_BASE: ${{ github.event.pull_request.base.sha }}
          APPROVED_SOURCE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, re, shutil, subprocess, time, urllib.parse
          root = pathlib.Path.cwd().resolve()
          scratch = pathlib.Path(os.environ['F04_PREFLIGHT_DIR']).resolve()
          out = scratch / 'safe'
          out.mkdir(mode=0o700)
          start = time.monotonic()
          summary = {'schema': 1, 'task': 'T006', 'source': os.environ['APPROVED_SOURCE'], 'base': os.environ['APPROVED_BASE'], 'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'status': 'BLOCKED', 'stage': 'identity'}
          approved = {'laravel/pint': '1.32.3', 'phpstan/phpstan': '2.3.7', 'larastan/larastan': '3.15.0'}
          expected_base = '24ce00231dec35a089bb70c081b257f9b5d234e7'
          env = {k:v for k,v in os.environ.items() if not any(s in k.upper() for s in ('TOKEN','SECRET','PASSWORD','CREDENTIAL','COMPOSER_AUTH','NPM_CONFIG_','NODE_AUTH','PROXY'))}
          env.update({'COMPOSER_HOME':str(scratch/'composer-home'), 'COMPOSER_CACHE_DIR':str(scratch/'composer-cache'), 'COMPOSER_NO_INTERACTION':'1', 'NPM_CONFIG_USERCONFIG':str(scratch/'empty.npmrc'), 'NPM_CONFIG_GLOBALCONFIG':str(scratch/'empty.npmrc'), 'NPM_CONFIG_CACHE':str(scratch/'npm-cache'), 'NPM_CONFIG_REGISTRY':'https://registry.npmjs.org/'})
          (scratch/'empty.npmrc').touch(mode=0o600)
          def cmd(args, cwd, stage):
              summary['stage'] = stage
              result = subprocess.run(args, cwd=cwd, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=300, check=False)
              (scratch/(stage+'.log')).write_bytes(result.stdout)
              if result.returncode != 0:
                  summary['exit_code'] = result.returncode
                  # Raw solver output stays private; expose only bounded public package constraint lines.
                  if stage.startswith('composer'):
                      lines = []
                      for line in result.stdout.decode('utf-8','replace').splitlines():
                          if re.fullmatch(r'\s*(?:Problem \d+|-\s+(?:Root composer\.json requires |[a-z0-9_.-]+/[a-z0-9_.-]+ )[A-Za-z0-9_./ ,\[\]{}()=<>^~|+*:\x27\x22-]{1,250})\s*',line):
                              if not re.search(r'token|password|secret|https?://',line,re.I):
                                  lines.append(line.strip())
                          if len(lines)>=15: break
                      summary['public_constraint_diagnostics']=lines
                  raise RuntimeError('Scoped dependency command failed')
              return result.stdout.decode('utf-8','replace').strip()
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          def require(ok, reason):
              if not ok:
                  summary['reason'] = reason
                  raise RuntimeError(reason)
          def packages(data):
              result={}
              for section in ('packages','packages-dev'):
                  for record in data[section]:
                      require(record['name'] not in result,'duplicate composer package')
                      result[record['name']]=(section,record)
              return result
          try:
              summary['checkout']=cmd(['git','rev-parse','HEAD'],root,'checkout')
              # Read immutable commit headers even when the default checkout is shallow.
              raw_commit=cmd(['git','cat-file','-p','HEAD'],root,'parents')
              parents=re.findall(r'^parent ([0-9a-f]{40})
              require(summary['base']==expected_base and parents==[summary['base'],summary['source']], 'integrated checkout identity mismatch')
              require(platform.machine()=='x86_64' and platform.system()=='Linux','unexpected hosted architecture')
              require(cmd(['git','hash-object','composer.json'],root,'manifest-identity')=='45ed7684ff7a779521d256bd78010093c78c7bcd','baseline manifest changed')
              require(cmd(['git','hash-object','composer.lock'],root,'lock-identity')=='74af82d8111ce6bb2947affbea58aea53ee09325','baseline lock changed')
              php=cmd(['php','-r','echo PHP_VERSION;'],root,'php-version')
              composer=cmd(['composer','--no-ansi','--version'],root,'composer-version')
              node=cmd(['node','--version'],root,'node-version')
              npm=cmd(['npm','--version'],root,'npm-version')
              extensions=cmd(['php','-r','echo json_encode(get_loaded_extensions());'],root,'extensions')
              require(php.startswith('8.4.') and 'Composer version 2.11.3 ' in composer,'PHP/Composer version mismatch')
              require(node=='v24.22.3' and tuple(map(int,npm.split('.')[:3])) >= (10,9,2),'Node/npm version mismatch')
              require({'dom','xml','mbstring','tokenizer','curl','fileinfo','pdo_sqlite'}.issubset(set(json.loads(extensions))),'PHP extensions missing')
              summary['versions']={'php':php,'composer':'2.11.3','node':node,'npm':npm,'platform':'linux/amd64'}
              # Use only copied manifest/lock; no app, dotenv, service config or vendor tree.
              cd=scratch/'composer'
              nd=scratch/'node'
              cd.mkdir(); nd.mkdir()
              shutil.copyfile(root/'composer.json',cd/'composer.json')
              shutil.copyfile(root/'composer.lock',cd/'composer.lock')
              original=json.loads((cd/'composer.lock').read_text())
              old=packages(original)
              manifest=json.loads((cd/'composer.json').read_text())
              require(set(manifest['require'])=={'php','laravel/framework'} and set(manifest['require-dev'])=={'pestphp/pest','pestphp/pest-plugin-laravel'},'unexpected baseline root dependency')
              require(manifest['config']['allow-plugins']=={'pestphp/pest-plugin':True},'plugin allowlist changed')
              manifest['require-dev'].update(approved)
              (cd/'composer.json').write_text(json.dumps(manifest,indent=2)+'\n')
              args=['composer','update',*approved,'--with-dependencies','--no-install','--no-plugins','--no-scripts','--no-interaction','--prefer-dist','--no-progress','--no-ansi']
              cmd(args+['--dry-run'],cd,'composer-dry-run')
              cmd(args,cd,'composer-lock-resolution')
              cmd(['composer','validate','--strict','--no-plugins','--no-scripts','--no-ansi'],cd,'composer-validate')
              result=json.loads((cd/'composer.lock').read_text())
              new=packages(result)
              changed=sorted(n for n in old if n not in new or old[n]!=new[n])
              summary['changed_old_records']=changed
              require(not changed,'old Composer package record drift')
              additions=sorted(set(new)-set(old))
              for name,version in approved.items():
                  require(name in new and new[name][0]=='packages-dev' and new[name][1]['version'].lstrip('v')==version,'approved exact package missing')
              for name in additions:
                  scope, record=new[name]
                  require(scope=='packages-dev' and record.get('type')!='composer-plugin','new runtime dependency or plugin')
                  for url in (record.get('source',{}).get('url'), record.get('dist',{}).get('url')):
                      if url:
                          u=urllib.parse.urlparse(url)
                          require(u.scheme=='https' and u.hostname in {'github.com','api.github.com','codeload.github.com'} and not u.username and not u.password and not u.query and not u.fragment,'unapproved composer acquisition URL')
              summary['composer_additions']=[{'name':n,'version':new[n][1]['version']} for n in additions]
              summary['composer_lock_sha256']=sha(cd/'composer.lock')
              require(not (cd/'vendor').exists(),'unexpected vendor install')
              (nd/'package.json').write_text(json.dumps({'name':'f04-quality-openapi','version':'0.0.0','private':True,'devDependencies':{'@redocly/cli':'2.83.0'}},indent=2)+'\n')
              cmd(['npm','install','--package-lock-only','--ignore-scripts','--no-audit','--no-fund','--registry=https://registry.npmjs.org/'],nd,'npm-lock-resolution')
              nlock=json.loads((nd/'package-lock.json').read_text())
              pkgs=nlock['packages']
              require(pkgs['']['devDependencies']=={'@redocly/cli':'2.83.0'} and pkgs['node_modules/@redocly/cli']['version']=='2.83.0','Redocly exact lock mismatch')
              require(nlock['lockfileVersion']==3 and len(pkgs)>1,'npm lock incomplete')
              for name,record in pkgs.items():
                  if not name: continue
                  u=urllib.parse.urlparse(record.get('resolved',''))
                  require(name.startswith('node_modules/') and not record.get('link') and u.scheme=='https' and u.hostname=='registry.npmjs.org' and not u.username and not u.password and not u.query and not u.fragment and re.fullmatch(r'sha(?:512|384|256|1)-[A-Za-z0-9+/=]+',record.get('integrity','')) is not None,'unapproved npm registry/integrity record')
              require(not (nd/'node_modules').exists(),'unexpected node_modules install')
              summary['npm_packages']=len(pkgs)-1
              summary['npm_lock_sha256']=sha(nd/'package-lock.json')
              summary['npm_lifecycle_candidates']=sorted(k for k,v in pkgs.items() if v.get('hasInstallScript'))
