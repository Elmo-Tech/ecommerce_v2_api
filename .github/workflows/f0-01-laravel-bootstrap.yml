name: Laravel foundation validation

# F0-04 T004: run the unchanged F0-03 baseline before adding quality tooling.

# F0-03 T004: trigger the unchanged foundation baseline on the reviewed PR candidate.

on:
  push:
    branches:
      - feature/f0-01-laravel-bootstrap
    paths:
      - composer.json
      - composer.lock
      - artisan
      - app/**
      - bootstrap/**
      - config/**
      - public/**
      - routes/**
      - lang/**
      - specs/002-api-foundation/contracts/**
      - tests/**
      - phpunit.xml
      - phpunit.integration.xml
      - .github/workflows/f0-01-laravel-bootstrap.yml
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches:
      - feature/f0-spec-kit-setup
      - development
    paths:
      - composer.json
      - composer.lock
      - artisan
      - app/**
      - bootstrap/**
      - config/**
      - public/**
      - routes/**
      - lang/**
      - specs/002-api-foundation/contracts/**
      - tests/**
      - phpunit.xml
      - phpunit.integration.xml
      - .github/workflows/f0-01-laravel-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f0-01-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Isolated PHP 8.4 Composer and Laravel smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_NAME: EcommerceSaaSAPI
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost
      APP_KEY: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      MAIL_MAILER: array
      XDEBUG_MODE: off
    steps:
      - name: Checkout the reviewed feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create private per-job report directory
        id: report_dir
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          report_dir="$(mktemp -d "$RUNNER_TEMP/f03-reports-XXXXXXXXXXXX")"
          printf 'F03_REPORT_DIR=%s\n' "$report_dir" >> "$GITHUB_ENV"

      - name: Install PHP 8.4 and required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_sqlite
          tools: composer:v2

      - name: Verify PHP and validate minimal Composer manifest
        run: |
          php -v
          composer --version
          composer validate --strict --no-check-publish

      - name: Validate committed dependency lock and platform
        run: |
          test -s composer.lock
          composer validate --strict --no-check-publish
          composer check-platform-reqs --lock

      - name: Publish committed lockfile for reproducibility review
        uses: actions/upload-artifact@v4
        with:
          name: f0-01-committed-composer-lock
          path: composer.lock
          retention-days: 7
          if-no-files-found: error

      - name: Install pinned dependencies without Composer scripts or plugins
        run: composer install --no-scripts --no-plugins --no-interaction --prefer-dist --no-progress

      - name: Audit pinned dependency versions
        run: composer audit --locked --no-interaction

      - name: Establish safe fast environment before framework bootstrap
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ ! -e .env ] && [ ! -L .env ]; then
            (set -o noclobber; : > .env)
          fi
          test -f .env && test ! -L .env && test ! -s .env
          git check-ignore -q .env
          php tests/Support/bootstrap.php

      - name: Verify actual installed packages and framework bootstrap
        run: |
          composer check-platform-reqs
          php -l bootstrap/app.php
          php -l routes/console.php
          php artisan about --no-ansi
          php artisan route:list --json

      - name: Verify all tracked PHP syntax before tests
        id: fast_ready
        run: git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l

      - name: Execute original foundation group with native JUnit
        id: foundation
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php foundation

      - name: Execute complete fast suite with native JUnit
        id: fast_all
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php fast-all

      - name: Execute independent Architecture with native JUnit
        id: architecture
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php architecture

      - name: Record blocked fast selections when preflight failed
        if: ${{ !cancelled() && steps.report_dir.outcome == 'success' && steps.fast_ready.outcome != 'success' }}
        shell: bash
        run: |
          set +e
          status=0
          for selection in foundation fast-all architecture; do
            php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php "$selection" --blocked
            code=$?
            if [ "$status" -eq 0 ] && [ "$code" -ne 0 ]; then status="$code"; fi
          done
          exit "$status"

      # Transitional acquisition check only (T008). No unguarded quality tool execution.
      # The actual read-only format and guarded level-6 analysis gates arrive in T012-T019/T042.
      - name: Verify installed approved quality packages without running analyzers
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: |
          set -euo pipefail
          git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l
          python3 - <<'PY'
          import json, pathlib, hashlib
          lock_path = pathlib.Path('composer.lock')
          assert hashlib.sha256(lock_path.read_bytes()).hexdigest() == '4f86a8d3e61aeddae531a177d901a0aa6632713116d9f959537102282079473e'
          lock = json.loads(lock_path.read_text())
          installed = json.loads(pathlib.Path('vendor/composer/installed.json').read_text())
          expected = {p['name']: p for p in lock['packages'] + lock['packages-dev']}
          actual = {p['name']: p for p in installed['packages']}
          assert len(expected) == 122 and len(actual) == 122 and set(expected) == set(actual), 'Installed package inventory mismatch'
          assert installed['dev'] is True
          for name, record in expected.items():
              observed = actual[name]
              assert observed['version'] == record['version'], 'Installed version mismatch: ' + name
              for kind in ('source', 'dist'):
                  if record.get(kind, {}).get('reference'):
                      assert observed.get(kind, {}).get('reference') == record[kind]['reference'], 'Installed reference mismatch: ' + name
          approved = {'laravel/pint': 'v1.32.3', 'phpstan/phpstan': '2.3.7', 'larastan/larastan': 'v3.15.0', 'iamcal/sql-parser': 'v0.7'}
          assert all(actual[n]['version'] == v for n, v in approved.items())
          assert pathlib.Path('vendor/larastan/larastan/extension.neon').is_file()
          print(json.dumps({'task': 'T008', 'installed_count': len(actual), 'approved_dev_packages': approved, 'installed_metadata': 'PASSED', 'format': 'NOT_RUN', 'analysis': 'NOT_RUN'}, sort_keys=True))
          PY
          test -x vendor/bin/pint
          test -x vendor/bin/phpstan
          echo "::notice title=Quality gates pending::Acquisition verified; Pint and guarded level-6 analysis are not run by this transitional check."

      - name: Verify runtime did not change any tracked repository file
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: git diff --exit-code -- .

      - name: Publish only validated fast JUnit and safe summaries
        id: fast_upload
        if: ${{ always() && steps.report_dir.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: f03-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.F03_REPORT_DIR }}/foundation-safe.xml
            ${{ env.F03_REPORT_DIR }}/foundation.summary.json
            ${{ env.F03_REPORT_DIR }}/fast-all-safe.xml
            ${{ env.F03_REPORT_DIR }}/fast-all.summary.json
            ${{ env.F03_REPORT_DIR }}/architecture-safe.xml
            ${{ env.F03_REPORT_DIR }}/architecture.summary.json
          retention-days: 7
          if-no-files-found: error

      - name: Clean only owned report files after publication
        id: fast_report_cleanup
        if: ${{ always() && steps.report_dir.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-reports.php

  f0-03-integration:
    name: F0-03 isolated native PostgreSQL and Redis integration
    needs: bootstrap
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      F03_MODE: integration
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      DB_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      XDEBUG_MODE: off
    steps:
      - name: Checkout exact integrated candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create private report directory
        id: report_dir
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          report_dir="$(mktemp -d "$RUNNER_TEMP/f03-reports-XXXXXXXXXXXX")"
          printf 'F03_REPORT_DIR=%s\n' "$report_dir" >> "$GITHUB_ENV"

      - name: Install approved PHP 8.4 native extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_sqlite, pdo_pgsql, redis-6.3.0
          tools: composer:v2

      - name: Validate actual hosted local Docker and immutable approved images
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          test "$APP_ENV" = testing
          test -z "${DOCKER_HOST:-}"
          test -z "${DOCKER_CONTEXT:-}"
          test -z "${DOCKER_TLS_VERIFY:-}"
          test -z "${DOCKER_CERT_PATH:-}"
          test -z "${DOCKER_CONFIG:-}"
          test -z "${DOCKER_API_VERSION:-}"
          test "$(docker context show)" = default
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock
          test -S /var/run/docker.sock
          test "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" = linux/amd64
          echo "Source checkout: $(git rev-parse HEAD)"
          for image in \
            docker.io/library/postgres:17.12-bookworm@sha256:c7a16500f728a9c09731e772f228ee7a29615585e8019772f05b620522f62d03 \
            docker.io/library/redis:8.2.11-bookworm@sha256:0e125214188816ac08e22435c7a5f58c61b8cbd3251d62e380d14fdf7659cd87; do
            docker --host unix:///var/run/docker.sock pull --platform linux/amd64 "$image"
            test "$(docker --host unix:///var/run/docker.sock image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
            digest="${image##*@}"
            docker --host unix:///var/run/docker.sock image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "@$digest" >/dev/null
            docker --host unix:///var/run/docker.sock image inspect "$image" --format 'Image ID={{.Id}} platform={{.Os}}/{{.Architecture}} RepoDigests={{json .RepoDigests}}'
          done

      - name: Verify locked packages and approved native drivers before setup
        shell: bash
        run: |
          set -euo pipefail
          php -v
          composer --version
          php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 4 || !in_array("pgsql", PDO::getAvailableDrivers(), true) || phpversion("redis") !== "6.3.0") { fwrite(STDERR, "Approved native driver/version unavailable.\n"); exit(1); } printf("pdo_pgsql=%s; phpredis=%s\n", phpversion("pdo_pgsql"), phpversion("redis"));'
          test -s composer.lock
          composer validate --strict --no-check-publish
          composer check-platform-reqs --lock
          composer install --no-scripts --no-plugins --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs
          composer audit --locked --no-interaction
          vendor/bin/pest --version
          vendor/bin/phpunit --version
          git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l

      - name: Bind a fresh run identity to this hosted job
        id: run_identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ ! -e .env ] && [ ! -L .env ]; then
            (set -o noclobber; : > .env)
          fi
          test -f .env && test ! -L .env && test ! -s .env
          git check-ignore -q .env
          token="$(php -r 'echo bin2hex(random_bytes(8));')"
          [[ "$token" =~ ^[0-9a-f]{16}$ ]]
          test ! -e "$RUNNER_TEMP/f03-$token"
          test ! -L "$RUNNER_TEMP/f03-$token"
          printf 'F03_RUN_TOKEN=%s\nF03_RUN_DESCRIPTOR=%s/f03-%s/runtime.json\n' "$token" "$RUNNER_TEMP" "$token" >> "$GITHUB_ENV"

      - name: Create and capture only owned isolated containers
        id: owned_start
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/start-owned.php

      - name: Configure owned PostgreSQL grants and Redis ACL
        id: owned_setup
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/setup-owned.php

      - name: Execute complete explicit native Integration suite
        id: integration_tests
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php integration

      - name: Record integration blocked before test execution
        if: ${{ !cancelled() && steps.report_dir.outcome == 'success' && steps.integration_tests.outcome == 'skipped' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php integration --blocked

      - name: Verify actual owned cleanup and repeat absence
        id: owned_cleanup
        if: ${{ always() && steps.run_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-owned.php
          php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-owned.php

      - name: Verify integration did not modify tracked repository files
        if: ${{ !cancelled() && steps.run_identity.outcome == 'success' }}
        run: git diff --exit-code -- .

      - name: Publish only validated integration JUnit and safe summary
        id: integration_upload
        if: ${{ always() && steps.report_dir.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: f03-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.F03_REPORT_DIR }}/integration-safe.xml
            ${{ env.F03_REPORT_DIR }}/integration.summary.json
          retention-days: 7
          if-no-files-found: error

      - name: Clean only owned report files after publication
        id: integration_report_cleanup
        if: ${{ always() && steps.report_dir.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-reports.php

  # Temporary T016 actual read-only diagnostic. A genuine style failure is
  # nonzero; the existing fast/native regression jobs remain independent.
  f0-04-t016-format-diagnostic:
    name: F0-04 T016 actual read-only Pint inventory
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact integrated candidate and base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create owned format diagnostic output directory
        id: scratch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          dir="$(mktemp -d "$RUNNER_TEMP/f04-t016-XXXXXXXXXXXX")"
          printf 'F04_T016_DIR=%s\n' "$dir" >> "$GITHUB_ENV"
          printf '%s:%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$dir/owner"

      - name: Install exact PHP quality toolchain
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_sqlite, tokenizer
          tools: composer:2.11.3

      - name: Install approved locked packages without scripts or plugins
        id: install
        run: |
          set -euo pipefail
          composer validate --strict --no-check-publish
          composer install --no-scripts --no-plugins --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs

      - name: Verify strict types of new files and run actual read-only format
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        shell: bash
        env:
          ACQUISITION_STATUS: ${{ steps.install.outcome }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys, time
          root = pathlib.Path.cwd().resolve()
          out = pathlib.Path(os.environ['F04_T016_DIR'])
          expected_base = '24ce00231dec35a089bb70c081b257f9b5d234e7'
          start = time.monotonic()
          summary = {'schemaVersion': 1, 'task': 'T016', 'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'status': 'BLOCKED', 'stage': 'acquisition'}
          # Diagnostic-only environment path is never inherited by the launcher.
          env = {k:v for k,v in os.environ.items() if k not in {'F04_T016_DIR','ACQUISITION_STATUS'}}
          def require(ok):
              if not ok: raise RuntimeError('Diagnostic proof incomplete')
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root, env=env, stderr=subprocess.DEVNULL, timeout=60)
          def run_php(args, input_bytes=None):
              return subprocess.run(['php', '-d', 'zend.exception_ignore_args=1', *args], cwd=root, env=env, input=input_bytes, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=650, check=False)
          def clean():
              for args in (['diff','--quiet','--','.'], ['diff','--cached','--quiet','--','.']):
                  require(subprocess.run(['git',*args], cwd=root, env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=60).returncode == 0)
          try:
              require(os.environ['ACQUISITION_STATUS']=='success')
              summary['stage']='identity'
              event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              pr=event['pull_request']
              source=pr['head']['sha']; base=pr['base']['sha']; checkout=git('rev-parse','HEAD').decode().strip()
              require(event['number']==9 and pr['base']['ref']=='development' and base==expected_base)
              require(all(re.fullmatch(r'[0-9a-f]{40}',x) for x in (source,base,checkout)))
              parents=re.findall(rb'^parent ([a-f0-9]{40})$',git('cat-file','-p','HEAD').split(b'\n\n',1)[0],re.M)
              require([x.decode() for x in parents]==[base,source])
              summary.update(sourceSha=source,baseSha=base,checkoutSha=checkout)
              summary['stage']='inventory'
              index=git('ls-files','--stage','-z').split(b'\0')
              require(index[-1]==b'')
              paths=[]
              for record in index[:-1]:
                  meta, name=record.split(b'\t',1)
                  path=name.decode('utf-8','strict')
                  if path=='artisan' or path.endswith('.php'):
                      require(meta.startswith((b'100644 ',b'100755 ')) and meta.endswith(b' 0'))
                      require((root/path).is_file() and not (root/path).is_symlink() and (root/path).resolve()==root/path)
                      paths.append(path)
              paths=sorted(paths)
              require(paths and len(paths)==len(set(paths)) and len(paths)<=10000)
              old=set(git('ls-tree','-r','--name-only','-z',base).decode('utf-8','strict').split('\0'))
              new=[path for path in paths if path not in old]
              code=r'''
          require 'tests/Support/TestEnvironmentGuard.php';
          require 'tools/quality/php-policy.php';
          \Tools\Quality\PhpQualityPolicy::assertNoOverrides();
          \Tests\Support\TestEnvironmentGuard::applyFast(getcwd());
          $new=json_decode(stream_get_contents(STDIN),true,flags:JSON_THROW_ON_ERROR);
          \Tools\Quality\PhpQualityPolicy::assertNewStrictTypes(getcwd(),$new);
          \Tools\Quality\PhpQualityPolicy::assertPintConfig(getcwd());
          echo json_encode(\Tools\Quality\PhpQualityPolicy::inventory(getcwd()),JSON_THROW_ON_ERROR|JSON_UNESCAPED_SLASHES);
          '''
              probe=run_php(['-r',code],json.dumps(new).encode())
              require(probe.returncode==0 and not probe.stderr and json.loads(probe.stdout)==paths)
              digest=hashlib.sha256(json.dumps(paths,ensure_ascii=False,separators=(',',':')).encode()).hexdigest()
              installed=json.loads((root/'vendor/composer/installed.json').read_text())
              require([p['version'] for p in installed['packages'] if p['name']=='laravel/pint']==['v1.32.3'])
              clean()
              summary['stage']='format'
              result=run_php(['tools/quality/run.php','format'])
              clean()
              require(result.returncode in (0,1) and not result.stderr)
              report=json.loads(result.stdout)
              require(set(report)=={'mode','selectedCount','toolExit','resultValidation','inventorySha256','findingCount','files'})
              require(report['mode']=='format' and report['resultValidation']=='VERIFIED' and report['selectedCount']==len(paths) and report['toolExit']==result.returncode and report['inventorySha256']==digest)
              findings=report['files']
              require(isinstance(findings,list) and findings==sorted(set(findings)) and set(findings)<=set(paths) and len(findings)==report['findingCount'])
              require((result.returncode==0)==(len(findings)==0))
              summary.update(status='PASSED' if result.returncode==0 else 'FAILED',stage='complete',pint='1.32.3',toolExit=result.returncode,selectedCount=len(paths),inventorySha256=digest,selectedPaths=paths,newStrictTypesPaths=new,findingCount=len(findings),findingPaths=findings,trackedSourceUnchanged=True)
          except (RuntimeError, OSError, ValueError, KeyError, TypeError, subprocess.SubprocessError):
              summary['status']='BLOCKED'
          finally:
              summary['durationSeconds']=round(time.monotonic()-start,3)
              with (out/'format-diagnostic.json').open('x') as f:
                  json.dump(summary,f,indent=2);f.write('\n')
              print(json.dumps({'task':'T016','status':summary['status'],'stage':summary['stage'],'selectedCount':summary.get('selectedCount'),'findingCount':summary.get('findingCount')}))
          sys.exit(0 if summary['status']=='PASSED' else 1 if summary['status']=='FAILED' else 2)
          PY

      - name: Publish only safe diagnostic summary
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: f04-t016-format-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.F04_T016_DIR }}/format-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Clean exact owned format diagnostic directory
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,re,stat
          p=pathlib.Path(os.environ['F04_T016_DIR'])
          parent=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          expected=os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_RUN_ATTEMPT']+'\n'
          assert not p.is_symlink() and p.resolve()==p and p.parent==parent and re.fullmatch(r'f04-t016-[A-Za-z0-9]{12}',p.name)
          assert p.stat().st_uid==os.geteuid() and stat.S_IMODE(p.stat().st_mode)==0o700
          names={x.name for x in p.iterdir()}
          assert names=={'owner','format-diagnostic.json'}
          for name in names:
              f=p/name;s=f.lstat()
              assert stat.S_ISREG(s.st_mode) and s.st_nlink==1 and s.st_uid==os.geteuid() and stat.S_IMODE(s.st_mode)==0o600
          assert (p/'owner').read_text()==expected
          for name in names: (p/name).unlink()
          p.rmdir()
          assert not p.exists()
          print('Owned T016 format diagnostic cleanup verified.')
          PY

  # Temporary T019 canonical launcher verification, not the final aggregate gate.
  # Real findings remain nonzero; existing regressions and Pint stay independent.
  f0-04-t019-analysis-verification:
    name: F0-04 T019 canonical Larastan level 6 verification
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout exact integrated candidate and base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create owned analysis diagnostic output directory
        id: scratch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          dir="$(mktemp -d "$RUNNER_TEMP/f04-t019-XXXXXXXXXXXX")"
          printf 'F04_T019_DIR=%s\n' "$dir" >> "$GITHUB_ENV"
          printf '%s:%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$dir/owner"

      - name: Install exact PHP quality toolchain
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_sqlite, tokenizer
          tools: composer:2.11.3

      - name: Install approved locked packages without scripts or plugins
        id: install
        run: |
          set -euo pipefail
          composer validate --strict --no-check-publish
          composer install --no-scripts --no-plugins --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs

      - name: Run canonical guarded Larastan level 6 launcher and verify evidence
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        shell: bash
        env:
          ACQUISITION_STATUS: ${{ steps.install.outcome }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys, time
          root = pathlib.Path.cwd().resolve()
          out = pathlib.Path(os.environ['F04_T019_DIR'])
          expected_base = '24ce00231dec35a089bb70c081b257f9b5d234e7'
          start = time.monotonic()
          summary = {'schemaVersion': 1, 'task': 'T019-launcher', 'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'status': 'BLOCKED', 'stage': 'acquisition'}
          # Diagnostic-only environment path is never inherited by the launcher.
          env = {k:v for k,v in os.environ.items() if k not in {'F04_T019_DIR','ACQUISITION_STATUS'}}
          def require(ok):
              if not ok: raise RuntimeError('Diagnostic proof incomplete')
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root, env=env, stderr=subprocess.DEVNULL, timeout=60)
          def run_php(args, input_bytes=None):
              return subprocess.run(['php', '-d', 'zend.exception_ignore_args=1', *args], cwd=root, env=env, input=input_bytes, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=950, check=False)
          def clean():
              for args in (['diff','--quiet','--','.'], ['diff','--cached','--quiet','--','.']):
                  require(subprocess.run(['git',*args], cwd=root, env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=60).returncode == 0)
          try:
              require(os.environ['ACQUISITION_STATUS']=='success')
              summary['stage']='identity'
              event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              pr=event['pull_request']
              source=pr['head']['sha']; base=pr['base']['sha']; checkout=git('rev-parse','HEAD').decode().strip()
              require(event['number']==9 and pr['base']['ref']=='development' and base==expected_base)
              require(all(re.fullmatch(r'[0-9a-f]{40}',x) for x in (source,base,checkout)))
              parents=re.findall(rb'^parent ([a-f0-9]{40})$',git('cat-file','-p','HEAD').split(b'\n\n',1)[0],re.M)
              require([x.decode() for x in parents]==[base,source])
              summary.update(sourceSha=source,baseSha=base,checkoutSha=checkout)
              summary['stage']='inventory'
              index=git('ls-files','--stage','-z').split(b'\0')
              require(index[-1]==b'')
              paths=[]
              for record in index[:-1]:
                  meta, name=record.split(b'\t',1)
                  path=name.decode('utf-8','strict')
                  if path=='artisan' or path.endswith('.php'):
                      require(meta.startswith((b'100644 ',b'100755 ')) and meta.endswith(b' 0'))
                      require((root/path).is_file() and not (root/path).is_symlink() and (root/path).resolve()==root/path)
                      paths.append(path)
              paths=sorted(paths)
              require(paths and len(paths)==len(set(paths)) and len(paths)<=10000)
              old=set(git('ls-tree','-r','--name-only','-z',base).decode('utf-8','strict').split('\0'))
              new=[path for path in paths if path not in old]
              code=r'''
          require 'tests/Support/TestEnvironmentGuard.php';
          require 'tools/quality/php-policy.php';
          \Tools\Quality\PhpQualityPolicy::assertNoOverrides();
          \Tests\Support\TestEnvironmentGuard::applyFast(getcwd());
          $new=json_decode(stream_get_contents(STDIN),true,flags:JSON_THROW_ON_ERROR);
          \Tools\Quality\PhpQualityPolicy::assertNewStrictTypes(getcwd(),$new);
          \Tools\Quality\PhpQualityPolicy::assertAnalysisConfig(getcwd());
          echo json_encode(\Tools\Quality\PhpQualityPolicy::inventory(getcwd()),JSON_THROW_ON_ERROR|JSON_UNESCAPED_SLASHES);
          '''
              probe=run_php(['-r',code],json.dumps(new).encode())
              require(probe.returncode==0 and not probe.stderr and json.loads(probe.stdout)==paths)
              digest=hashlib.sha256(json.dumps(paths,ensure_ascii=False,separators=(',',':')).encode()).hexdigest()
              installed=json.loads((root/'vendor/composer/installed.json').read_text())
              pins={'phpstan/phpstan':'2.3.7','larastan/larastan':'3.15.0'}
              for name,version in pins.items():
                  require([p['version'] for p in installed['packages'] if p['name']==name]==['v'+version] or [p['version'] for p in installed['packages'] if p['name']==name]==[version])
              clean()
              summary.update(stage='analysis',level=6,phpstan=pins['phpstan/phpstan'],larastan=pins['larastan/larastan'],selectedCount=len(paths),inventorySha256=digest,selectedPaths=paths)
              # Execute the real launcher, not a second implementation of its guard.
              result=run_php(['tools/quality/run.php','analyse'])
              clean()
              summary.update(toolExit=result.returncode,trackedSourceUnchanged=True,launcher='tools/quality/run.php analyse')
              require(result.returncode in (0,1) and not result.stderr and 0<len(result.stdout)<=16777216)
              summary['stage']='result-validation'
              def unique(pairs):
                  obj={}
                  for key,value in pairs:
                      require(key not in obj)
                      obj[key]=value
                  return obj
              report=json.loads(result.stdout,object_pairs_hook=unique)
              require(isinstance(report,dict) and set(report)=={'mode','selectedCount','toolExit','resultValidation','inventorySha256','findingCount','findings'})
              require(report['mode']=='analyse' and report['resultValidation']=='VERIFIED')
              require(type(report['selectedCount']) is int and report['selectedCount']==len(paths) and report['inventorySha256']==digest)
              require(type(report['toolExit']) is int and report['toolExit']==result.returncode)
              findings=report['findings']
              require(isinstance(findings,list) and type(report['findingCount']) is int and len(findings)==report['findingCount']<=10000)
              for finding in findings:
                  require(isinstance(finding,dict) and set(finding)=={'path','line','identifier','ignorable'})
                  path=finding['path']
                  require(isinstance(path,str) and path in paths)
                  require(type(finding['line']) is int and 1<=finding['line']<=(root/path).read_bytes().count(b'\n')+1)
                  identifier=finding['identifier']
                  require(isinstance(identifier,str) and len(identifier)<=100 and re.fullmatch(r'[a-zA-Z][a-zA-Z0-9]*(?:\.[a-zA-Z0-9]+)*',identifier))
                  require(type(finding['ignorable']) is bool)
              require(findings==sorted(findings,key=lambda f:(f['path'],f['line'],f['identifier'],f['ignorable'])))
              require((result.returncode==0)==(len(findings)==0))
              summary.update(status='PASSED' if result.returncode==0 else 'FAILED',stage='complete',resultValidation='VERIFIED',findingCount=len(findings),findings=findings,ownedChildCleanupVerified=True)
          except (RuntimeError, OSError, ValueError, KeyError, TypeError, subprocess.SubprocessError):
              summary['status']='BLOCKED'
          finally:
              summary['durationSeconds']=round(time.monotonic()-start,3)
              with (out/'analysis-diagnostic.json').open('x') as f:
                  json.dump(summary,f,indent=2);f.write('\n')
              print(json.dumps({'task':'T019-launcher','status':summary['status'],'stage':summary['stage'],'selectedCount':summary.get('selectedCount'),'findingCount':summary.get('findingCount')}))
          sys.exit(0 if summary['status']=='PASSED' else 1 if summary['status']=='FAILED' else 2)
          PY

      - name: Publish only safe diagnostic summary
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: f04-t019-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.F04_T019_DIR }}/analysis-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Clean exact owned analysis diagnostic directory
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,re,stat
          p=pathlib.Path(os.environ['F04_T019_DIR'])
          parent=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          expected=os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_RUN_ATTEMPT']+'\n'
          assert not p.is_symlink() and p.resolve()==p and p.parent==parent and re.fullmatch(r'f04-t019-[A-Za-z0-9]{12}',p.name)
          assert p.stat().st_uid==os.geteuid() and stat.S_IMODE(p.stat().st_mode)==0o700
          names={x.name for x in p.iterdir()}
          assert names=={'owner','analysis-diagnostic.json'}
          for name in names:
              f=p/name;s=f.lstat()
              assert stat.S_ISREG(s.st_mode) and s.st_nlink==1 and s.st_uid==os.geteuid() and stat.S_IMODE(s.st_mode)==0o600
          assert (p/'owner').read_text()==expected
          for name in names: (p/name).unlink()
          p.rmdir()
          assert not p.exists()
          print('Owned T019 analysis diagnostic cleanup verified.')
          PY

