name: Laravel foundation validation

# F0-03 T004: trigger the unchanged foundation baseline on the reviewed PR candidate.

on:
  push:
    branches:
      - feature/f0-01-laravel-bootstrap
    paths:
      - composer.json
      - composer.lock
      - artisan
      - app/**
      - bootstrap/**
      - config/**
      - public/**
      - routes/**
      - lang/**
      - specs/002-api-foundation/contracts/**
      - tests/**
      - phpunit.xml
      - phpunit.integration.xml
      - .github/workflows/f0-01-laravel-bootstrap.yml
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches:
      - feature/f0-spec-kit-setup
      - development
    paths:
      - composer.json
      - composer.lock
      - artisan
      - app/**
      - bootstrap/**
      - config/**
      - public/**
      - routes/**
      - lang/**
      - specs/002-api-foundation/contracts/**
      - tests/**
      - phpunit.xml
      - phpunit.integration.xml
      - .github/workflows/f0-01-laravel-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f0-01-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Isolated PHP 8.4 Composer and Laravel smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_NAME: EcommerceSaaSAPI
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost
      APP_KEY: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      MAIL_MAILER: array
      XDEBUG_MODE: off
    steps:
      - name: Checkout the reviewed feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create private per-job report directory
        id: report_dir
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          report_dir="$(mktemp -d "$RUNNER_TEMP/f03-reports-XXXXXXXXXXXX")"
          printf 'F03_REPORT_DIR=%s\n' "$report_dir" >> "$GITHUB_ENV"

      - name: Install PHP 8.4 and required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_sqlite
          tools: composer:v2

      - name: Verify PHP and validate minimal Composer manifest
        run: |
          php -v
          composer --version
          composer validate --strict --no-check-publish

      - name: Validate committed dependency lock and platform
        run: |
          test -s composer.lock
          composer validate --strict --no-check-publish
          composer check-platform-reqs --lock

      - name: Publish committed lockfile for reproducibility review
        uses: actions/upload-artifact@v4
        with:
          name: f0-01-committed-composer-lock
          path: composer.lock
          retention-days: 7
          if-no-files-found: error

      - name: Install pinned dependencies without Composer scripts or plugins
        run: composer install --no-scripts --no-plugins --no-interaction --prefer-dist --no-progress

      - name: Audit pinned dependency versions
        run: composer audit --locked --no-interaction

      - name: Establish safe fast environment before framework bootstrap
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ ! -e .env ] && [ ! -L .env ]; then
            (set -o noclobber; : > .env)
          fi
          test -f .env && test ! -L .env && test ! -s .env
          git check-ignore -q .env
          php tests/Support/bootstrap.php

      - name: Verify actual installed packages and framework bootstrap
        run: |
          composer check-platform-reqs
          php -l bootstrap/app.php
          php -l routes/console.php
          php artisan about --no-ansi
          php artisan route:list --json

      - name: Verify all tracked PHP syntax before tests
        id: fast_ready
        run: git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l

      - name: Execute original foundation group with native JUnit
        id: foundation
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php foundation

      - name: Execute complete fast suite with native JUnit
        id: fast_all
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php fast-all

      - name: Execute independent Architecture with native JUnit
        id: architecture
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php architecture

      - name: Record blocked fast selections when preflight failed
        if: ${{ !cancelled() && steps.report_dir.outcome == 'success' && steps.fast_ready.outcome != 'success' }}
        shell: bash
        run: |
          set +e
          status=0
          for selection in foundation fast-all architecture; do
            php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php "$selection" --blocked
            code=$?
            if [ "$status" -eq 0 ] && [ "$code" -ne 0 ]; then status="$code"; fi
          done
          exit "$status"

      - name: PHP syntax lint and optional quality-tool availability
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: |
          git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l
          if [ -x vendor/bin/pint ]; then
            vendor/bin/pint --test
          else
            echo "::notice title=Pint unavailable::Laravel Pint is not in the approved composer.lock; no Pint pass is claimed."
          fi
          if [ -x vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse --no-progress
          else
            echo "::notice title=PHPStan unavailable::PHPStan/Larastan is not in the approved composer.lock; no static-analyzer pass is claimed."
          fi

      - name: Verify runtime did not change any tracked repository file
        if: ${{ !cancelled() && steps.fast_ready.outcome == 'success' }}
        run: git diff --exit-code -- .

      - name: Publish only validated fast JUnit and safe summaries
        id: fast_upload
        if: ${{ always() && steps.report_dir.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: f03-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.F03_REPORT_DIR }}/foundation-safe.xml
            ${{ env.F03_REPORT_DIR }}/foundation.summary.json
            ${{ env.F03_REPORT_DIR }}/fast-all-safe.xml
            ${{ env.F03_REPORT_DIR }}/fast-all.summary.json
            ${{ env.F03_REPORT_DIR }}/architecture-safe.xml
            ${{ env.F03_REPORT_DIR }}/architecture.summary.json
          retention-days: 7
          if-no-files-found: error

      - name: Clean only owned report files after publication
        id: fast_report_cleanup
        if: ${{ always() && steps.report_dir.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-reports.php

  f0-03-integration:
    name: F0-03 isolated native PostgreSQL and Redis integration
    needs: bootstrap
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      F03_MODE: integration
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      DB_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      XDEBUG_MODE: off
    steps:
      - name: Checkout exact integrated candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create private report directory
        id: report_dir
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          report_dir="$(mktemp -d "$RUNNER_TEMP/f03-reports-XXXXXXXXXXXX")"
          printf 'F03_REPORT_DIR=%s\n' "$report_dir" >> "$GITHUB_ENV"

      - name: Install approved PHP 8.4 native extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_sqlite, pdo_pgsql, redis-6.3.0
          tools: composer:v2

      - name: Validate actual hosted local Docker and immutable approved images
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          test "$APP_ENV" = testing
          test -z "${DOCKER_HOST:-}"
          test -z "${DOCKER_CONTEXT:-}"
          test -z "${DOCKER_TLS_VERIFY:-}"
          test -z "${DOCKER_CERT_PATH:-}"
          test -z "${DOCKER_CONFIG:-}"
          test -z "${DOCKER_API_VERSION:-}"
          test "$(docker context show)" = default
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock
          test -S /var/run/docker.sock
          test "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" = linux/amd64
          echo "Source checkout: $(git rev-parse HEAD)"
          for image in \
            docker.io/library/postgres:17.12-bookworm@sha256:c7a16500f728a9c09731e772f228ee7a29615585e8019772f05b620522f62d03 \
            docker.io/library/redis:8.2.11-bookworm@sha256:0e125214188816ac08e22435c7a5f58c61b8cbd3251d62e380d14fdf7659cd87; do
            docker --host unix:///var/run/docker.sock pull --platform linux/amd64 "$image"
            test "$(docker --host unix:///var/run/docker.sock image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
            digest="${image##*@}"
            docker --host unix:///var/run/docker.sock image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "@$digest" >/dev/null
            docker --host unix:///var/run/docker.sock image inspect "$image" --format 'Image ID={{.Id}} platform={{.Os}}/{{.Architecture}} RepoDigests={{json .RepoDigests}}'
          done

      - name: Verify locked packages and approved native drivers before setup
        shell: bash
        run: |
          set -euo pipefail
          php -v
          composer --version
          php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 4 || !in_array("pgsql", PDO::getAvailableDrivers(), true) || phpversion("redis") !== "6.3.0") { fwrite(STDERR, "Approved native driver/version unavailable.\n"); exit(1); } printf("pdo_pgsql=%s; phpredis=%s\n", phpversion("pdo_pgsql"), phpversion("redis"));'
          test -s composer.lock
          composer validate --strict --no-check-publish
          composer check-platform-reqs --lock
          composer install --no-scripts --no-plugins --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs
          composer audit --locked --no-interaction
          vendor/bin/pest --version
          vendor/bin/phpunit --version
          git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l

      - name: Bind a fresh run identity to this hosted job
        id: run_identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ ! -e .env ] && [ ! -L .env ]; then
            (set -o noclobber; : > .env)
          fi
          test -f .env && test ! -L .env && test ! -s .env
          git check-ignore -q .env
          token="$(php -r 'echo bin2hex(random_bytes(8));')"
          [[ "$token" =~ ^[0-9a-f]{16}$ ]]
          test ! -e "$RUNNER_TEMP/f03-$token"
          test ! -L "$RUNNER_TEMP/f03-$token"
          printf 'F03_RUN_TOKEN=%s\nF03_RUN_DESCRIPTOR=%s/f03-%s/runtime.json\n' "$token" "$RUNNER_TEMP" "$token" >> "$GITHUB_ENV"

      - name: Create and capture only owned isolated containers
        id: owned_start
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/start-owned.php

      - name: Configure owned PostgreSQL grants and Redis ACL
        id: owned_setup
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/setup-owned.php

      - name: Execute complete explicit native Integration suite
        id: integration_tests
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php integration

      - name: Record integration blocked before test execution
        if: ${{ !cancelled() && steps.report_dir.outcome == 'success' && steps.integration_tests.outcome == 'skipped' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php integration --blocked

      - name: Verify actual owned cleanup and repeat absence
        id: owned_cleanup
        if: ${{ always() && steps.run_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-owned.php
          php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-owned.php

      - name: Verify integration did not modify tracked repository files
        if: ${{ !cancelled() && steps.run_identity.outcome == 'success' }}
        run: git diff --exit-code -- .

      - name: Publish only validated integration JUnit and safe summary
        id: integration_upload
        if: ${{ always() && steps.report_dir.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: f03-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.F03_REPORT_DIR }}/integration-safe.xml
            ${{ env.F03_REPORT_DIR }}/integration.summary.json
          retention-days: 7
          if-no-files-found: error

      - name: Clean only owned report files after publication
        id: integration_report_cleanup
        if: ${{ always() && steps.report_dir.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-reports.php

  # T031 one-time controlled diagnostic job. Intentionally FAILED, never a
  # required-green substitute. Remove this job after recording actual evidence.
  # No services, external targets, test credentials or bypass of required lanes.
  f0-03-report-failure-diagnostic:
    name: F0-03 T031 controlled expected failure
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_NAME: EcommerceSaaSAPI
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost
      APP_KEY: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      DB_URL: ""
      MAIL_MAILER: array
      XDEBUG_MODE: off
    steps:
      - name: Checkout integrated diagnostic candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install PHP for real report CLI diagnostics
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: dom, xml

      - name: Create private diagnostic report directory
        id: diagnostic_dir
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          report_dir="$(mktemp -d "$RUNNER_TEMP/f03-reports-XXXXXXXXXXXX")"
          printf 'F03_REPORT_DIR=%s\n' "$report_dir" >> "$GITHUB_ENV"
          if [ ! -e .env ] && [ ! -L .env ]; then
            (set -o noclobber; : > .env)
          fi
          test -f .env && test ! -L .env && test ! -s .env

      - name: Verify absent owned integration prerequisites block real report CLI
        shell: bash
        run: |
          set -euo pipefail
          test -z "${F03_RUN_TOKEN:-}"
          test -z "${F03_RUN_DESCRIPTOR:-}"
          status=0
          F03_MODE=integration php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php integration || status=$?
          test "$status" -eq 2
          test ! -e "$F03_REPORT_DIR/integration-safe.xml"
          php -r '$s=json_decode(file_get_contents(getenv("F03_REPORT_DIR")."/integration.summary.json"),true,512,JSON_THROW_ON_ERROR); if($s["status"]!=="BLOCKED"||$s["exit_code"]!==2||$s["runner_started"]!==false||$s["tests_executed"]!==false||$s["counts"]!==null||$s["selection_verified"]!==false)exit(1);'
          echo "Actual missing-owned-prerequisite report rejected before runner startup."

      - name: Verify existing raw destination cannot be overwritten and cleanup refuses unknown file
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          (set -o noclobber; printf 'synthetic invalid raw report\n' > "$F03_REPORT_DIR/foundation-raw.xml")
          status=0
          php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php foundation || status=$?
          test "$status" -eq 2
          test ! -e "$F03_REPORT_DIR/foundation-safe.xml"
          grep -Fx 'synthetic invalid raw report' "$F03_REPORT_DIR/foundation-raw.xml" >/dev/null
          php -r '$s=json_decode(file_get_contents(getenv("F03_REPORT_DIR")."/foundation.summary.json"),true,512,JSON_THROW_ON_ERROR); if($s["status"]!=="BLOCKED"||$s["exit_code"]!==2||$s["runner_started"]!==false||$s["counts"]!==null)exit(1);'
          (set -o noclobber; printf 'owned synthetic sentinel\n' > "$F03_REPORT_DIR/diagnostic-unknown.keep")
          status=0
          php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-reports.php || status=$?
          test "$status" -eq 2
          test -f "$F03_REPORT_DIR/integration.summary.json"
          test -f "$F03_REPORT_DIR/foundation.summary.json"
          test -f "$F03_REPORT_DIR/foundation-raw.xml"
          grep -Fx 'owned synthetic sentinel' "$F03_REPORT_DIR/diagnostic-unknown.keep" >/dev/null
          rm -- "$F03_REPORT_DIR/diagnostic-unknown.keep"
          echo "Actual report collision and cleanup refusal verified; original reports unchanged."

      - name: Intentionally fail this diagnostic job using real blocked report CLI
        id: diagnostic_blocked
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/run-report.php architecture --blocked

      - name: Publish safe blocked summaries despite failed diagnostic
        id: diagnostic_upload
        if: ${{ always() && steps.diagnostic_dir.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: f03-t031-blocked-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.F03_REPORT_DIR }}/integration.summary.json
            ${{ env.F03_REPORT_DIR }}/foundation.summary.json
            ${{ env.F03_REPORT_DIR }}/architecture.summary.json
          retention-days: 7
          if-no-files-found: error

      - name: Intentionally reject missing artifact input
        id: diagnostic_missing_upload
        if: ${{ always() && steps.diagnostic_dir.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: f03-t031-must-not-exist-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.F03_REPORT_DIR }}/diagnostic-absent.xml
          retention-days: 7
          if-no-files-found: error

      - name: Verify expected diagnostic failures and successful safe upload
        if: ${{ always() }}
        env:
          BLOCKED_OUTCOME: ${{ steps.diagnostic_blocked.outcome }}
          SAFE_UPLOAD_OUTCOME: ${{ steps.diagnostic_upload.outcome }}
          MISSING_UPLOAD_OUTCOME: ${{ steps.diagnostic_missing_upload.outcome }}
        run: |
          test "$BLOCKED_OUTCOME" = failure
          test "$SAFE_UPLOAD_OUTCOME" = success
          test "$MISSING_UPLOAD_OUTCOME" = failure
          echo "Actual blocked command and missing upload failed; safe failure evidence was uploaded."

      - name: Clean only owned diagnostic report files
        if: ${{ always() && steps.diagnostic_dir.outcome == 'success' }}
        run: php -d zend.exception_ignore_args=1 tests/Support/ci/cleanup-reports.php
