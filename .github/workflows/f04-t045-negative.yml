name: T045 bounded negative diagnostic

on:
  pull_request:
    branches: [development]
    types: [synchronize]
    paths:
      - '.github/workflows/f04-t045-negative.yml'
      - 'tools/quality/t045-negative.py'

permissions:
  contents: read

jobs:
  negative-proof:
    if: ${{ github.repository == 'Elmo-Tech/ecommerce_v2_api' && github.event.pull_request.number == 9 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/f0-04-code-quality-ci' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create exact owned report directory
        id: directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          dir="$(mktemp -d "$RUNNER_TEMP/f04-t045-report-XXXXXXXXXXXX")"
          printf 'F04_T045_REPORT=%s\n' "$dir" >> "$GITHUB_ENV"
          test ! -e "$dir/absent.json"

      - name: Actual missing upload must fail
        id: missing_upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: t045-intentionally-absent-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.F04_T045_REPORT }}/absent.json
          if-no-files-found: error
          retention-days: 7

      - name: Real scratch classifier and gate controls with deliberate non-green exit
        id: gate
        if: ${{ always() && steps.directory.outcome == 'success' }}
        shell: bash
        env:
          F04_MISSING_UPLOAD_OUTCOME: ${{ steps.missing_upload.outcome }}
        run: |
          set -euo pipefail
          umask 077
          set -o noclobber
          python3 -B tools/quality/t045-negative.py > "$F04_T045_REPORT/t045.summary.json"

      - name: Upload bounded diagnostic evidence
        if: ${{ always() && steps.directory.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: f04-t045-negative-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.F04_T045_REPORT }}/t045.summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify owned report cleanup
        if: ${{ always() && steps.directory.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, stat
          from pathlib import Path
          p=Path(os.environ["F04_T045_REPORT"])
          assert p.parent==Path(os.environ["RUNNER_TEMP"]).resolve()
          assert re.fullmatch(r"f04-t045-report-[A-Za-z0-9]{12}",p.name)
          assert not p.is_symlink() and p.resolve()==p and p.stat().st_uid==os.geteuid()
          assert stat.S_IMODE(p.stat().st_mode)==0o700
          f=p/"t045.summary.json"
          assert set(x.name for x in p.iterdir())=={f.name}
          s=f.lstat()
          assert stat.S_ISREG(s.st_mode) and s.st_nlink==1 and s.st_uid==os.geteuid()
          f.unlink()
          p.rmdir()
          assert not p.exists()
          PY
